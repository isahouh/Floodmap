name: Fetch flood test data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/fetch.py', '.github/workflows/fetch-data.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python data/fetch.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update flood test data" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
